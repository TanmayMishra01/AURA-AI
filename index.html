      (function() {
        try {
          var target = window;
          var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
          if (!desc) {
            var proto = Object.getPrototypeOf(target);
            if (proto) desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
          }
          if (desc && !desc.set) {
            var currentFetch = target.fetch;
            Object.defineProperty(target, 'fetch', {
              get: function() { return currentFetch; },
              set: function(v) { currentFetch = v; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn("Fetch property guard initialized with warning:", e);
        }
      })();
    </script>
